name: Pages

# Build the unified playground and TypeDoc API reference and publish
# them together to GitHub Pages on every push to master. Playground
# lives at the site root, TypeDoc at /api/.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: "37 */6 * * *"

# Allow only one concurrent deployment, skipping runs queued between
# the in-progress and latest push. Do not cancel in-progress runs since
# we want production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out family kit
        uses: actions/checkout@v7
        with:
          repository: rekurt/rekurt.github.io
          ref: main
          path: family

      - uses: actions/setup-go@v7
        with:
          go-version-file: family/go.mod
          cache-dependency-path: family/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library packages
        run: npm run build

      - name: Build playground
        run: npm run build -w examples/playground
        env:
          PLAYGROUND_BASE: /openkline/

      - name: Generate TypeDoc
        run: npm run docs

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R examples/playground/dist/* _site/
          mkdir -p _site/api
          cp -R docs/api/* _site/api/

      - name: Refresh public catalog
        working-directory: family
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: go run ./cmd/catalog-sync sync --manifest catalog/projects.yaml --snapshot site/src/data/generated/catalog.json --audit docs/repository-audit.md

      - name: Add project family navigation
        working-directory: family
        run: >-
          go run ./cmd/project-site decorate
          --slug openkline
          --snapshot site/src/data/generated/catalog.json
          --repo ..
          --out ../_site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Validate decorated website
        working-directory: family
        run: >-
          go run ./cmd/project-site validate
          --slug openkline
          --snapshot site/src/data/generated/catalog.json
          --repo ..
          --out ../_site
          --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
